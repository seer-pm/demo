fragment Question on Question {
  questionId
  index
  arbitrator
  opening_ts
  timeout
  finalize_ts
  is_pending_arbitration
  best_answer
  bond
  min_bond
}

fragment Market on Market {
  address
  chainId
  marketType
  marketName
  outcomes
  wrappedTokens
  collateralToken
  collateralToken1
  collateralToken2
  parentMarket {
    address
    chainId
    payoutReported
    conditionId
    payoutNumerators
  }
  parentOutcome
  parentCollectionId
  conditionId
  questionId
  templateId
  hasAnswers
  questionsInArbitration
  questions {
    question {
      questionId
      arbitrator
      opening_ts
      timeout
      finalize_ts
      is_pending_arbitration
      best_answer
      bond
      min_bond
      index
    }
    baseQuestion {
      questionId
    }
  }
  openingTs
  finalizeTs
  encodedQuestions
  lowerBound
  upperBound
  payoutReported
  payoutNumerators
  factory
  creator
  outcomesSupply
  blockTimestamp
  transactionHash
}

query GetMarkets(
  $where: Market_bool_exp
  $offset: Int = 0
  $limit: Int = 100
  $orderBy: [Market_order_by!]
) {
  Market(where: $where, offset: $offset, limit: $limit, order_by: $orderBy) {
    ...Market
  }
}

query GetMarket($id: String!) {
  market: Market_by_pk(id: $id) {
    ...Market
  }
}

query GetConditionalEvents(
  $where: ConditionalEvent_bool_exp
  $offset: Int = 0
  $limit: Int = 100
  $orderBy: [ConditionalEvent_order_by!]
) {
  ConditionalEvent(where: $where, offset: $offset, limit: $limit, order_by: $orderBy) {
    id
    market {
      id
      address
      marketName
    }
    accountId
    stakeholder
    eventType
    amount
    blockNumber
    timestamp
    collateral
    parentCollectionId
    conditionId
    transactionHash
  }
}

query GetCurateMetadata($id: String!) {
  curateMetadata: CurateMetadata_by_pk(id: $id) {
    registrationMetaEvidenceURI
  }
}

query GetArbitratorMetadata($id: String!) {
  arbitratorMetadata: ArbitratorMetadata_by_pk(id: $id) {
    registrationMetaEvidenceURI
  }
}

fragment Transfer on Transfer {
  chainId
  from
  to
  timestamp
  blockNumber
  transactionHash
  transactionFrom
  logIndex
  value
  kind
  involvesRouter
  market {
    id
    address
  }
  token {
    id
  }
}

query GetTransfers(
  $offset: Int = 0
  $limit: Int = 1000
  $where: Transfer_bool_exp
  $orderBy: [Transfer_order_by!]
) {
  Transfer(limit: $limit, offset: $offset, where: $where, order_by: $orderBy) {
    ...Transfer
  }
}

query GetTokenBalances(
  $where: TokenBalance_bool_exp
  $offset: Int = 0
  $limit: Int = 1000
  $orderBy: [TokenBalance_order_by!]
) {
  TokenBalance(where: $where, offset: $offset, limit: $limit, order_by: $orderBy) {
    id
    chainId
    token
    account
    balance
    updatedAtBlock
    updatedAtTimestamp
    lastDailyDayStart
  }
}

# Sparse EOD balances resolved at up to four day boundaries in ONE round trip.
# `distinct_on: [token]` + `order_by: [{token}, {dayStartTimestamp: desc}]` returns the latest
# row per token at or before each bound, so callers no longer paginate an account's whole
# TokenBalanceDaily history. Unused slots take a where-clause that matches nothing.
query GetTokenBalanceDailiesAtEods(
  $where0: TokenBalanceDaily_bool_exp
  $where1: TokenBalanceDaily_bool_exp
  $where2: TokenBalanceDaily_bool_exp
  $where3: TokenBalanceDaily_bool_exp
  $offset: Int = 0
  $limit: Int = 1000
) {
  eod0: TokenBalanceDaily(
    distinct_on: [token]
    order_by: [{ token: asc }, { dayStartTimestamp: desc }]
    where: $where0
    offset: $offset
    limit: $limit
  ) {
    ...TokenBalanceDailyAtEod
  }
  eod1: TokenBalanceDaily(
    distinct_on: [token]
    order_by: [{ token: asc }, { dayStartTimestamp: desc }]
    where: $where1
    offset: $offset
    limit: $limit
  ) {
    ...TokenBalanceDailyAtEod
  }
  eod2: TokenBalanceDaily(
    distinct_on: [token]
    order_by: [{ token: asc }, { dayStartTimestamp: desc }]
    where: $where2
    offset: $offset
    limit: $limit
  ) {
    ...TokenBalanceDailyAtEod
  }
  eod3: TokenBalanceDaily(
    distinct_on: [token]
    order_by: [{ token: asc }, { dayStartTimestamp: desc }]
    where: $where3
    offset: $offset
    limit: $limit
  ) {
    ...TokenBalanceDailyAtEod
  }
}

fragment TokenBalanceDailyAtEod on TokenBalanceDaily {
  token
  dayStartTimestamp
  balance
}

query GetTokenBalanceDailies(
  $where: TokenBalanceDaily_bool_exp
  $offset: Int = 0
  $limit: Int = 1000
  $orderBy: [TokenBalanceDaily_order_by!]
) {
  TokenBalanceDaily(where: $where, offset: $offset, limit: $limit, order_by: $orderBy) {
    id
    chainId
    account
    token
    dayStartTimestamp
    balance
  }
}

query GetAccountActivity($id: String!) {
  accountActivity: AccountActivity_by_pk(id: $id) {
    id
    chainId
    account
    earliestTransferTimestamp
    lastTransferTimestamp
    transferCount
  }
}

query GetAccountActivities($account: String!) {
  AccountActivity(where: { account: { _eq: $account } }) {
    id
    chainId
    account
    earliestTransferTimestamp
    lastTransferTimestamp
    transferCount
  }
}
